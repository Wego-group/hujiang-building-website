name: Publish scheduled news
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run news:publish
      - run: |
          git config user.name "Megasteel News Publisher"
          git config user.email "news-publisher@users.noreply.github.com"
          git add content/news public/images/news news-published news-failed news-queue
          git diff --cached --quiet || (git commit -m "Publish scheduled news" && git push)
